project:
  name: "vehicle_speed_yolo"
  version: "0.1.0"
  description: "Benchmark de detección vehicular con variantes YOLO para TFG"

detection:
  # Modelos a evaluar — variantes ligeras priorizadas para hardware embebido
  models:
    - id: "yolov8n"
      weights: "yolov8n.pt"
      description: "YOLOv8 Nano — más liviano, mayor velocidad"
    - id: "yolov8s"
      weights: "yolov8s.pt"
      description: "YOLOv8 Small — balance entre velocidad y precisión"
    - id: "yolov8m"
      weights: "yolov8m.pt"
      description: "YOLOv8 Medium — mayor precisión, más pesado"
    - id: "yolo11n"
      weights: "yolo11n.pt"
      description: "YOLO11 Nano — versión más reciente, muy liviana"
    - id: "yolo11s"
      weights: "yolo11s.pt"
      description: "YOLO11 Small — versión más reciente, liviana"

  # Clases de vehículos en COCO dataset
  vehicle_classes:
    2: "car"
    3: "motorcycle"
    5: "bus"
    7: "truck"

  confidence_threshold: 0.40
  iou_threshold: 0.45

benchmark:
  warmup_frames: 15          # Frames de calentamiento (no se miden)
  max_frames: 300            # Máximo de frames a procesar por video
  device: "cpu"              # "cpu" simula condiciones de RPi4; "cuda" si hay GPU
  save_annotated_frames: true
  annotated_frame_interval: 50  # Guardar un frame anotado cada N frames

paths:
  data: "data/"
  videos: "data/videos/"
  models: "models/"
  results: "results/"
  benchmarks: "results/benchmarks/"
  plots: "results/plots/"
  frames: "results/frames/"

preview:
  default_model: "yolov8n"      # Modelo por defecto para la visualización
  max_display_width: 1280       # Si el video es más ancho, se reescala solo para mostrar
  playback_fps: 0                # 0 = tan rápido como pueda; >0 = limita a esa tasa
  show_hud: true                 # Panel de información sobre el video
  show_confidence: true          # Mostrar el valor de confianza en cada caja
  box_thickness: 2
  font_scale: 0.5
  fps_window: 30                 # Frames para el promedio móvil de FPS mostrado en pantalla
  export_codec: "mp4v"           # Codec para el video exportado
  export_dir: "results/preview/"
  snapshots_dir: "results/preview/snapshots/"

roi:
  enabled: false                # Por defecto apagado: las corridas previas siguen siendo comparables
  file: "config/roi.json"       # Dónde se guarda el polígono
  mode: "filter"                # "filter" | "crop" | "mask"
  ground_point: "bottom_center" # Punto del bbox usado para la prueba dentro/fuera
  tolerance_px: 0                # Margen: >0 acepta detecciones ligeramente fuera del borde
  draw_overlay: true             # Dibujar el polígono en la vista previa
  overlay_alpha: 0.20

  heatmap:
    sample_mode: "uniform"      # "uniform" | "middle" | "range"
    samples: 300                 # Cuántos frames se muestrean para el mapa de calor
    range_start_sec: 0.0          # Solo para sample_mode "range"
    range_end_sec: 0.0            # 0 = hasta el final
    model: "yolov8n"              # Modelo usado para acumular (el más rápido basta)
    confidence: 0.25               # Umbral BAJO a propósito: acá se busca cobertura, no precisión
    blur_kernel: 41                 # Suavizado gaussiano del mapa acumulado (impar)
    colormap: "COLORMAP_JET"
    alpha: 0.45                      # Mezcla del mapa sobre el frame de fondo
