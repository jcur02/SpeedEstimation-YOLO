project:
  name: "vehicle_speed_yolo"
  version: "0.1.0"
  description: "Benchmark de detección vehicular con variantes YOLO para TFG"

detection:
  # Modelos a evaluar — variantes ligeras priorizadas para hardware embebido
  models:
    - id: "yolov8n"
      weights: "yolov8n.pt"
      description: "YOLOv8 Nano — más liviano, mayor velocidad"
    - id: "yolov8s"
      weights: "yolov8s.pt"
      description: "YOLOv8 Small — balance entre velocidad y precisión"
    - id: "yolov8m"
      weights: "yolov8m.pt"
      description: "YOLOv8 Medium — mayor precisión, más pesado"
    - id: "yolo11n"
      weights: "yolo11n.pt"
      description: "YOLO11 Nano — versión más reciente, muy liviana"
    - id: "yolo11s"
      weights: "yolo11s.pt"
      description: "YOLO11 Small — versión más reciente, liviana"

  # Clases de vehículos en COCO dataset
  vehicle_classes:
    2: "car"
    3: "motorcycle"
    5: "bus"
    7: "truck"

  confidence_threshold: 0.40
  iou_threshold: 0.45

benchmark:
  warmup_frames: 15          # Frames de calentamiento (no se miden)
  max_frames: 300            # Máximo de frames a procesar por video
  device: "cpu"              # "cpu" simula condiciones de RPi4; "cuda" si hay GPU
  save_annotated_frames: true
  annotated_frame_interval: 50  # Guardar un frame anotado cada N frames

paths:
  data: "data/"
  videos: "data/videos/"
  models: "models/"
  results: "results/"
  benchmarks: "results/benchmarks/"
  plots: "results/plots/"
  frames: "results/frames/"

preview:
  default_model: "yolov8n"      # Modelo por defecto para la visualización
  max_display_width: 1280       # Si el video es más ancho, se reescala solo para mostrar
  playback_fps: 0                # 0 = tan rápido como pueda; >0 = limita a esa tasa
  show_hud: true                 # Panel de información sobre el video
  show_confidence: true          # Mostrar el valor de confianza en cada caja
  box_thickness: 2
  font_scale: 0.5
  fps_window: 30                 # Frames para el promedio móvil de FPS mostrado en pantalla
  export_codec: "mp4v"           # Codec para el video exportado
  export_dir: "results/preview/"
  snapshots_dir: "results/preview/snapshots/"

roi:
  enabled: false                # Por defecto apagado: las corridas previas siguen siendo comparables
  file: "config/roi.json"       # Dónde se guarda el polígono
  mode: "filter"                # "filter" | "crop" | "mask"
  ground_point: "bottom_center" # Punto del bbox usado para la prueba dentro/fuera
  tolerance_px: 0                # Margen: >0 acepta detecciones ligeramente fuera del borde
  draw_overlay: true             # Dibujar el polígono en la vista previa
  overlay_alpha: 0.20

  heatmap:
    sample_mode: "uniform"      # "uniform" | "middle" | "range"
    samples: 300                 # Cuántos frames se muestrean para el mapa de calor
    range_start_sec: 0.0          # Solo para sample_mode "range"
    range_end_sec: 0.0            # 0 = hasta el final
    model: "yolov8n"              # Modelo usado para acumular (el más rápido basta)
    confidence: 0.25               # Umbral BAJO a propósito: acá se busca cobertura, no precisión
    blur_kernel: 41                 # Suavizado gaussiano del mapa acumulado (impar)
    colormap: "COLORMAP_JET"
    alpha: 0.45                      # Mezcla del mapa sobre el frame de fondo

tracking:
  enabled: false
  default_tracker: "bytetrack"      # "bytetrack" | "botsort"
  tracker_config_dir: "config/trackers/"
  tracks_dir: "results/tracks/"

  smoothing_window: 5               # Media móvil sobre los puntos de contacto (impar, 0 = sin suavizar)
  min_track_frames: 10              # Menos que esto se considera fragmento
  min_displacement_px: 40           # Menos que esto se considera vehículo estacionado
  border_margin_px: 20              # Margen para considerar que un bbox toca el borde del frame

  visualization:
    trail_length: 40                # Puntos de estela conservados por ID
    trail_ttl_frames: 15            # Frames que sobrevive la estela de un ID perdido
    color_by_id: true                # false = colorear por clase
    show_ids: true
    show_trails: true
    show_lost_trails: true          # Estelas grises de tracks recién perdidos
    id_font_scale: 0.6
    show_speed: true                 # Overlay de velocidad en vivo (solo con --speed y calibración cargada)

calibration:
  file: "config/calibration.json"
  points_csv: "config/points.csv"
  output_dir: "results/calibration/"

  fit_method: "least_squares"    # "least_squares" | "ransac"
  ransac_threshold_m: 0.5        # En METROS: el umbral se aplica en el espacio de destino

  thresholds:
    reprojection_ok_m: 0.15      # Bajo esto, calibración aceptable
    reprojection_warn_m: 0.30    # Sobre esto, no continuar a velocidad
    loo_ok_m: 0.30
    loo_warn_m: 0.60
    min_hull_ratio: 0.05         # Cobertura mínima del casco convexo
    max_scale_cm_per_px: 30.0    # Sobre esto, la zona no sirve para medir

  aerial:
    enabled: true                # false = siempre modo manual
    provider: "maptiler"
    api_key_env: "MAPTILER_KEY"  # Nombre de la variable de entorno; NUNCA la llave misma
    cache_dir: "data/aerial/"
    default_zoom: 20
    size: [1024, 1024]
    warn_m_per_px: 0.20

  birdseye:
    px_per_meter: 20
    margin_m: 5

speed:
  estimator: "window"              # "window" | "endpoint" | "cumulative"
  window_s: 0.7                    # Ancho de la ventana de ajuste, en segundos
  min_window_points: 5             # Mínimo de puntos por ventana
  smoothing_window_metric: 5       # Suavizado en metros (impar, 0 = desactivado)
  skip_pixel_smoothing: true       # Evita suavizar dos veces si el seguimiento ya lo hizo

  filters:
    min_observations: 15           # Observaciones mínimas tras filtrar
    min_distance_m: 5.0            # Recorrido mínimo para estimar
    min_speed_kmh: 3.0             # Debajo de esto se considera detenido
    max_plausible_kmh: 150.0       # Encima de esto, salto imposible → probable cambio de ID
    max_scale_cm_per_px: 15.0      # Descarta observaciones donde la escala se degrada
    hull_margin_m: 2.0             # Margen permitido fuera de la zona calibrada
    min_r_squared: 0.85            # Ajuste mínimo aceptable

  validation:
    reference_csv: "config/speed_reference.csv"
    output_dir: "results/speed/validation/"

  synthetic:
    output_dir: "results/speed/synthetic/"
    repetitions: 30                # Repeticiones por combinación
    seed: 42                       # Semilla base, para reproducibilidad
    speeds_kmh: [20, 30, 40, 50, 60, 80]
    noise_px: [0, 1, 2, 4, 8]
    fps: 30.0
    duration_s: 3.0

  output_dir: "results/speed/"
